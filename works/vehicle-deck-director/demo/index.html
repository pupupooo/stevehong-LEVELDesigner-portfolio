<!-- 演示说明 -->
<div id="demo-brief">
  <div class="brief-card">
    <div class="brief-kicker">PORTFOLIO DEMO / VEHICLE DECK DIRECTOR</div>
    <h1>大世界载具玩法与事件导演 Demo</h1>
    <p>
      在涩谷-代官山启发的城市白盒中驾驶，观察事件如何根据车辆、地点和玩家行为出现。
      本 demo 重点展示 T2 载具玩法分发、事件接入提示，以及抢车后的世界响应如何影响导演调度。
    </p>
    <div class="brief-steps">
      <span>驾驶一段距离或时间后抽牌</span>
      <span>出现可接入事件提示</span>
      <span>按 E 接入 / Esc 忽略</span>
      <span>车辆、地点、热度影响推荐</span>
    </div>
    <button id="brief-start" type="button">开始演示</button>
  </div>
</div>

<!-- 游戏区 -->
<div id="game-area">
  <canvas id="game-canvas"></canvas>
</div>

  </div>

</div>
